<article class="product-card" data-category="{{ product.category }}">
<a href="/producto/{{ product.id }}" class="product-picture photo-only"><img class="ambient-image" data-fallback src="{{ product.imagen_url|image_size(640) }}" srcset="{{ product.imagen_url|image_size(640) }} 640w, {{ product.imagen_url|image_size(1280) }} 1280w" sizes="(max-width: 640px) 100vw, (max-width: 1100px) 50vw, 33vw" alt="{{ product.nombre }}" loading="lazy" width="600" height="640">{% if product.featured %}<span class="product-badge">Selección Valerion</span>{% endif %}</a>
<div class="product-info"><p class="eyebrow">{{ product.category or c.collection_label }}</p><div class="product-title-row"><h3><a href="/producto/{{ product.id }}">{{ product.nombre }}</a></h3><p class="price">{{ product.precio|mxn }} <small>MXN</small></p></div><p class="product-description">{{ product.descripcion }}</p><a class="product-discover" href="/producto/{{ product.id }}">{{ c.collection_discover }} <span aria-hidden="true">↗</span></a></div>
</article>
