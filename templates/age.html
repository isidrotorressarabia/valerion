<dialog id="age-dialog" class="age-dialog" aria-labelledby="age-title"><img src="{{ c.logo_image }}" data-fallback width="44" height="58" alt=""><p class="eyebrow">{{ c.age_eyebrow }}</p><h2 id="age-title">{{ c.age_title }}<br>{{ c.age_second }} <em>{{ c.age_em }}</em></h2><p>{{ c.age_question }}</p><div class="age-actions"><button id="age-confirm" class="button">{{ c.age_yes }}</button><button id="age-decline" class="button secondary">{{ c.age_no }}</button></div><p id="age-denied" role="alert" hidden>{{ c.age_denied }}</p><small>{{ c.age_note }}</small></dialog>
