services:
  - type: web
    name: valerion
    runtime: python
    plan: free
    buildCommand: pip install --require-hashes --only-binary=:all: -r requirements-cloud.lock
    startCommand: python -m uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1 --no-proxy-headers --limit-concurrency 64 --timeout-keep-alive 5 --no-access-log --log-config logging.json
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.12
      - key: APP_ENV
        value: production
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: CLOUDINARY_FOLDER
        value: valerion_catalogo
      - key: DB_POOL_MAX
        value: "5"
      - key: COOKIE_SECURE
        value: "true"
      - key: SEED_DEMO
        value: "false"
      - key: PUBLIC_BASE_URL
        sync: false
      - key: DELIVERY_KEYS
        sync: false
      - key: PROXY_HOPS
        value: "1"
      - key: NOTIFY_EMAIL
        sync: false
      - key: LEGAL_NAME
        sync: false
      - key: LEGAL_ADDRESS
        sync: false
      - key: LEGAL_EMAIL
        sync: false
      - key: LEGAL_RFC
        sync: false
      - key: LEGAL_COVERAGE
        sync: false
      - key: LEGAL_SHIPPING
        sync: false
      - key: LEGAL_LEAD_TIME
        sync: false
      - key: LEGAL_RETURN_WINDOW
        sync: false
      - key: LEGAL_JURISDICTION
        sync: false
      - key: LEGAL_PRICES_NOTE
        sync: false
