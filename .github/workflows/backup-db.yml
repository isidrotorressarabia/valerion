name: Respaldo completo de PostgreSQL

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * *"   # diario, 09:17 UTC

permissions:
  contents: read

jobs:
  pg-dump:
    # Solo en repositorios privados: el artefacto contiene datos de clientes (cifrados con GPG).
    if: github.event.repository.private == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Instalar cliente PostgreSQL 17
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17
      - name: Respaldar
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: ./scripts/pg_respaldo.sh respaldos
      - uses: actions/upload-artifact@v4
        with:
          name: valerion-pg-respaldo
          path: respaldos/*.gpg
          retention-days: 14
          if-no-files-found: error
